<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davis Ariel</title>
    <meta
      name="description"
      content="Professional profile for Davis Ariel, an Informatics student focused on data analytics, web development, and quality assurance."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      const savedTheme = localStorage.getItem("portfolio-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: light)")
        .matches
        ? "light"
        : "dark";
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#home" aria-label="Back to home">
          <span class="brand-mark">DA</span>
          <span>Davis Ariel</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#education">Education</a>
          <a href="#skills">Skill</a>
          <a href="#experience">Experience</a>
          <a href="#projects">Projects</a>
          <a href="#certificates">Certificates</a>
          <a class="nav-cta" href="#contact">Contact</a>
        </nav>

        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to light theme"
          aria-pressed="false"
        >
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
        </button>
      </header>

      <main id="portfolio-content"></main>
    </div>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
